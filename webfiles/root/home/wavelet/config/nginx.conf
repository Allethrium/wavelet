server {
        listen  80; ## listen for ipv4; this line is default and implied
        listen  443 ssl ;
        listen  [::]:80 default_server ipv6only=on; ## listen for ipv6
        http2 on;
        # If certs are available (IE Domain functionality and security layer=on, we define them here:
        ssl_certificate         /etc/pki/tls/certs/httpd.crt;
        ssl_certificate_key     /etc/pki/tls/private/httpd.key;
        ssl_protocols           TLSv1.2 TLSv1.3;
        server_name             _;
        root /var/www/html;
        index index.html index.htm index.php;
        # Make site accessible from http://localhost/
        server_name localhost;
        error_page 404 /404.html;
        # redirect server error pages to the static page /50x.html
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
                root /var/www/html;
        }

        # WebSocket endpoint (optional - falls back to SSE if unavailable)
        location /ws {
                proxy_pass http://127.0.0.1:8080;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_read_timeout 86400; # 24 hours
                proxy_connect_timeout 5s; # Fail fast if WS server is down

                # Return 503 instead of 502 for better client handling
                error_page 502 503 504 = @websocket_unavailable;
        }

        location @websocket_unavailable {
                return 503 '{"error":"WebSocket service unavailable - using SSE fallback"}';
                add_header Content-Type application/json;
        }

        # SSE Endpoint for additional workers
        location /sse.php {
            fastcgi_pass 127.0.0.1:9001;  # SSE pool
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 3600s;
            fastcgi_buffering off;
        }

        location ~ \.php$ {
                try_files $uri =404;
                include /etc/nginx/fastcgi_params;
                fastcgi_pass 127.0.0.1:9000;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_intercept_errors on;
        }
}