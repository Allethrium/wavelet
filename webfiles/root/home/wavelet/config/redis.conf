# Network
bind 0.0.0.0
port 6379
tcp-backlog 511

# Authentication
requirepass my-redis-password

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence - AOF
appendonly yes
appendfsync everysec

# Persistence - RDB snapshots
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice

# Performance
tcp-keepalive 300
timeout 0