# /etc/ptp4l.conf
# PTP4L Configuration for AES67 / PTP Client

[global]
# Use the default PTP profile (Profile 0 for IEEE 1588-2008)
profile 0

# Operate as a client only (sync to a PTP Grandmaster)
slave_only 1

# Network transport: UDPv4 for local network PTP
network_transport UDPv4

# PTP domain number
domain_number 0

# Logging settings
log_level 4
message_SYNC 0
message_DELAY_REQ 0
message_PDELAY_REQ 0
message_PDELAY_RESP 0
message_DELAY_RESP 0
message_PDELAY_RESP_FOLLOW_UP 0
message_SYNC_FOLLOW_UP 0
message_ANNOUNCE 0
message_SIGNALLING 0
message_MANAGEMENT 0

# Replace 'ethX' with your actual PTP-capable network interface name
# Example: [enp3s0] or [eth1]
# Handled in install_packages.sh during bootstrap
[ethX]