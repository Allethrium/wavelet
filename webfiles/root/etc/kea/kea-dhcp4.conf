{
	"Dhcp4": {
		"authoritative": true,
		"client-classes": [
			{
				"name": "efihttp",
				"test": "substring(option[60].hex,0,10) == 'HTTPClient'",
				"option-data": [
					{
						"name": "boot-file-name",
						"data": "http://pxeserver:8080/pxe/shim.efi"
					},
                    {
                        "space": "dhcp4",
                        "name": "vendor-class-identifier",
                        "code": 60,
                        "data": "HTTPClient"
                    }
				]
			},
			{
				"name": "tftp-efi-x86_64",
				"test": "option[93].hex == 0x0007",
                "next-server": "192.168.1.32",
				"option-data": [
					{
						"name": "tftp-server-name",
						"data": "pxeserver"
					},
					{
						"name": "boot-file-name",
						"data": "shimx64.efi"
					}
				]
			},
			{
				"name": "tftp-efi-x86_32",
				"test": "option[93].hex == 0x0000",
				"next-server": "192.168.1.32",
				"option-data": [
					{
						"name": "tftp-server-name",
						"data": "pxeserver"
					},
					{
						"name": "boot-file-name",
						"data": "shim.efi"
					}
				]
			},
			{
				"name": "unknown-arch",
				"test": "option[93].exists",
				"next-server": "192.168.1.32",
				"option-data": [
					{
						"name": "tftp-server-name",
						"data": "pxeserver"
					},
					{
						"name": "boot-file-name",
						"data": "shim.efi"
					}
				]
			}
		],
		"control-socket": {
			"socket-name": "/run/kea/kea4-ctrl-socket",
			"socket-type": "unix"
		},
        "dhcp-ddns" : {
            "enable-updates" : true,
            "server-ip" : "127.0.0.1",
            "server-port" : 53001,
            "sender-ip" : "",
            "sender-port" : 0,
            "max-queue-size" : 1024,
            "ncr-protocol" : "UDP",
            "ncr-format" : "JSON"
        },
		"ddns-send-updates" : true,
		//"ddns-override-client-update" : true,
		//"ddns-override-no-update": true,
		"ddns-qualifying-suffix": "wavelet.allethrium.",
        //"ddns-replace-client-name": "always",
		"ddns-generated-prefix": "new",
		"ddns-update-on-renew": true,
        "hostname-char-set": "[^A-Za-z0-9.-]",
		"hooks-libraries": [
			{
				"library": "/usr/lib64/kea/hooks/libdhcp_run_script.so",
				"parameters": {
					"name": "/usr/share/kea/scripts/wavelet_network_sense.sh",
					"sync": false
				}
			}
		],
		"interfaces-config": {
			"interfaces": [
				"*"
			]
		},
		"lease-database": {
			"lfc-interval": 3600,
			"name": "/var/lib/kea/dhcp4.leases",
			"persist": true,
			"type": "memfile"
		},
		"max-valid-lifetime": 7200,
		"valid-lifetime": 600,
		"subnet4": [
			{
				"id": 1,
				"subnet": "192.168.1.0/24",
				"pools": [
					{
						"pool": "192.168.1.8 - 192.168.1.31"
					}
				],
				"option-data": [
					{
						"name": "routers",
						"data": "192.168.1.1"
					},
					{
						"name": "domain-name-servers",
						// THIS IS OVERWRITTEN WITH THE IP ADDRESS OF DC1 ON SPINUP
						"data": "dc1"
					},
					{
						"name": "domain-name",
						"data": "wavelet.allethrium"
					}
				]
			}
		],
        "loggers": [
            {
                "name": "kea-dhcp4",
                "output-options": [
                    {
                        "output": "/var/log/kea/dhcp4.log",
                        "flush": true,
                        "maxsize": 204800,
                        "maxver": 4,
                        "pattern": "%d{%y.%m.%d %H:%M:%S.%q} %-5p [%c/%i] %m\n"
                    }
                ],
                "severity": "INFO"
            }
        ]
      }
}