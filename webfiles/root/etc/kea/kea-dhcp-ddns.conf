{
    "DhcpDdns":
        {
            "ip-address": "127.0.0.1",
            "port": 53001,
            "ncr-protocol": "UDP",
            "ncr-format": "JSON",
            "control-socket": {
                "socket-type": "unix",
                "socket-name": "/run/kea/kea-ddns-ctrl-socket"
            },
            <?include "/etc/kea/tsig-keys/KEA-DHCP.json"?>
            "forward-ddns" : {
                "ddns-domains" : [
                    {
                        "name": "wavelet.allethrium.",
                        "key-name": "KEA-DHCP",
                        "dns-servers": [
                            {
                                "ip-address": "dc1"
                            }
                        ]
                    }
                ]
            },
            // IPA should handle PTR sync, so we only update the main zone
            //"reverse-ddns" : {
            //    "ddns-domains" : [
            //        {
            //            "name": "1.168.192.in-addr.arpa.",
            //            "key-name": "KEA-DHCP",
            //            "dns-servers": [
            //                {
            //                    "ip-address": "dc1"
            //                }
            //            ]
            //        }
            //    ]
            //},
            "loggers": [
                {
                    "name": "kea-dhcp-ddns",
                    "output_options": [
                        {
                            "output": "/var/log/kea/dhcp4-ddns.log",
                            "pattern": "%-5p %m\n"
                        }
                    ],
                    "severity": "INFO",
                    "debuglevel": 20
                }
            ]
        }
}