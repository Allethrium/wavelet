# This is the configuration file for the etcd server.

# Human-readable name for this member.
name: 'wavelet_svr'

# Path to the data directory.
data-dir: /etcd-data
# These must be IP addresses, the TLS requires an x509 SAN IP:xxx.xxx.xxx.xxx field which is VERY DIFFICULT to issue and track
listen-peer-urls: https://svrIP:2380
listen-client-urls: https://svrIP:2379,https://svrIP:4001,https://localhost:2379
# These two can be hostnames so that they work with our issued FreeIPA certificates
initial-advertise-peer-urls: https://svrHostName:2380
advertise-client-urls: https://svrHostName:2379

# Comma separated string of initial cluster configuration for bootstrapping.
initial-cluster: wavelet_svr=https://svrIP:2380
initial-cluster-state: 'new'
strict-reconfig-check: false

client-transport-security:
  # Path to the client server TLS cert file.
  cert-file: /etc/pki/tls/certs/etcd.crt
  # Path to the client server TLS key file.
  key-file: /etc/pki/tls/private/etcd.key
  # Enable client cert authentication.
  # This means the CLIENT will need a valid certificate+key in order to speak to the etcd cluster!!
  #client-cert-auth: true
  # Path to the client server TLS trusted CA cert file.  Enabling this will assume client-cert-auth: true
  #trusted-ca-file: /etc/ipa/ca.crt
  # Client TLS using generated certificates
  auto-tls: false

peer-transport-security:
  # Path to the peer server TLS cert file.
  cert-file: /etc/pki/tls/certs/etcd.crt
  # Path to the peer server TLS key file.
  key-file: /etc/pki/tls/private/etcd.key
  # Enable peer client cert authentication.
  #client-cert-auth: false
  # Path to the Server TLS trusted CA cert file.  Enabling this will assume client-cert-auth: true
  #trusted-ca-file:
  # Peer TLS using generated certificates.
  auto-tls: true
  # Allowed CN for inter peer authentication.
  #allowed-cn:
  # Allowed TLS hostname for inter peer authentication.
  #allowed-hostname:

# The validity period of the self-signed certificate, the unit is year.
self-signed-cert-validity: 14

# Enable debug-level logging for etcd.
log-level: warn
logger: zap
# Specify 'stdout' or 'stderr' to skip journald logging even when running under systemd.
log-outputs: [stderr]
# Force to create a new one member cluster.
force-new-cluster: false
auto-compaction-mode: periodic
auto-compaction-retention: "1"

# Limit etcd to a specific set of tls cipher suites
cipher-suites: [
  TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,
  TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
]
# Limit etcd to specific TLS protocol versions 
tls-min-version: 'TLS1.2'
tls-max-version: 'TLS1.3'