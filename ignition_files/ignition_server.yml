# This file aims to provide a usable base CoreOS image that runs Server tasks.
# ignition:
# version: 3.5.0
---
variant: fcos
version: 1.6.0
kernel_arguments:
  should_exist:
    # - nosmt
    - preempt=full
    - threadirqs
    - mitigations=off
    - ip=192.168.1.32::192.168.1.1:255.255.255.0:svr.wavelet.allethrium::on
    - cpufreq.default_governor=performance
    - nvme_probe_timeout=3
    - nvme_core.default_ps_max_latency_us=200000
    - rhgb
    - quiet
    - splash
    - rd.neednet=1
    - rd.timeout=10
storage:
  disks:
    - device: /dev/disk/by-id/coreos-boot-disk
      partitions:
        - number: 3
          label: boot
          size_mib: 2048
          resize: true
          wipe_partition_entry: true
        - number: 4
          label: root
          size_mib: 0
          start_mib: 0
          resize: false
          wipe_partition_entry: true
  filesystems:
    - device: /dev/disk/by-partlabel/boot
      label: boot
      format: xfs
      wipe_filesystem: true
    - device: /dev/disk/by-partlabel/root
      format: xfs
      label: root
      wipe_filesystem: true
  files:
    # Setup Ignition Files
    # This is required to spinup the decoder ISO once the server boots.
    # the local file is relative to --files-dir cmdline option in Butane
    # The customized decoder yml file which can be modified and regenerated once server provisioned
    - path: /home/wavelet/config/decoder_custom.yml
      mode: 0644
      overwrite: true
      contents:
        local: decoder_custom.yml
    # Wavelet master zipfile, decompressed immediately upon ignition systemd units starting
    - path: /var/master.tar.gz
      mode: 0644
      contents:
        source: https://github.com/Allethrium/wavelet/archive/refs/heads/master.tar.gz
    # Client automated installer ignition
    - path: /home/wavelet/config/automated_installer.yml
      mode: 0644
      overwrite: true
      contents:
        local: automated_installer.yml
    # Client automated installer script
    - path: /home/wavelet/config/automated_coreos_deployment.sh
      mode: 0755
      overwrite: true
      contents:
        local: automated_coreos_deployment.sh
    # The key file, which replaces most of the ignition entries
    - path: /var/wavelet_keys.csv
      mode: 0600
      contents:
       local: wavelet_keys.csv
    # Satisfy bootc/rpm-ostree JSON parser requirement to pull from registry
    - path: /etc/ostree/auth.json
      mode: 0644
      overwrite: true
      contents:
        inline: |
          {
            "auths": {}
          }
    # Initial setup script - handles creating wavelet /usr/local/bin and installing the ostree layer
    - path: /usr/local/bin/wavelet_install_packages.sh
      mode: 0755
      contents:
       local: wavelet_install_packages.sh
    # UltraGrid executable - track latest stable release where possible
    - path: /usr/local/bin/UltraGrid.AppImage
      mode: 0755
      contents:
        source: https://github.com/CESNET/UltraGrid/releases/download/v1.10.1/UltraGrid-1.10.1-x86_64.AppImage
# Systemd user units are generated by wavelet_build on logon
# Directories and files are generated by wavelet_generate_ostree service below
# user accounts, passwords and pubkeys (populated from installer)
passwd:
  users:
      #ADD_USER_YAML_HERE
# Configure SYSTEM systemd units
systemd:
  units:
    # Note, this creates all the /var/.complete files in script.
    - name: wavelet_installer.service
      enabled: true
      contents: |
        [Unit]
        Description=Install packages, generate second-boot systemd rootful units
        Before=getty@tty1.service             
        ConditionFirstBoot=yes
        Wants=network-online.target
        # Also wait for NM-wait-online so the static IP is actually up
        After=network-online.target NetworkManager-wait-online.service
        [Service]
        Type=oneshot
        ExecStart=/usr/bin/bash -c '/usr/local/bin/wavelet_install_packages.sh "master.tar.gz" "/var/wavelet_keys.csv"'
        ExecStartPost=-systemctl reboot
        [Install]
        WantedBy=multi-user.target
    # Reboot service
    - name: server-reboot.timer
      enabled: true
      contents: |
          [Unit]
          Description=Daily Reboot
          [Timer]
          OnCalendar=*-*-* 06:00:00
          [Install]
          WantedBy=timers.target
    # Reboot service timer
    - name: server-reboot.service
      contents: |
          [Unit]
          Description=Daily Reboot
          [Service]
          Type=simple
          ExecStart=/usr/bin/systemctl --force reboot
    # Mask docker entirely
    - name: docker.service
      mask: true
    - name: docker.socket
      mask: true
    # Mask irqbalance
    - name: irqbalance.service
      mask: true
    # Autologin dropin service
    - name: getty@tty1.service
      dropins:
        - name: autologin-core.conf
          contents: |
            [Unit]
            Description=Wait for wavelet packages to install before starting autologin
            After=wavelet_installer.service
            ConditionPathExists=/var/rpm-ostree-overlay.rpmfusion.pkgs.complete
            [Service]
            # Override Execstart in main unit
            ExecStart=            
            ExecStart=-/usr/sbin/agetty --autologin wavelet --noclear %I $TERM